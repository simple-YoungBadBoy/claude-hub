name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: tests + build + e2e (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: scripts/check.sh
        # use the runner's preinstalled Chrome instead of downloading Chromium
        env:
          E2E_CHROME: /usr/bin/google-chrome
        run: scripts/check.sh
      - name: e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/out/

  mac:
    name: Mac app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac/src-tauri
      - name: build
        run: |
          cd mac
          npm install
          npx tauri icon app-icon.png
          npx tauri build --bundles app
